# Opens weekly pull requests for outdated NuGet packages and GitHub Actions. Avalonia's packages share one version
# (AvaloniaVersion in Directory.Packages.props), so they are updated together.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      skiasharp:
        patterns: ["SkiaSharp*"]
      xunit:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
