# Publishes self-contained builds of UML Wizard for Windows, Linux and macOS and attaches them to a GitHub release.
# Triggered by pushing a version tag, e.g.:  git tag v1.0.0 && git push origin v1.0.0
# The tag (without the "v") becomes the application's version, shown in Help -> About.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test UmlWizard.slnx -c Release

  publish:
    needs: test
    strategy:
      matrix:
        include:
          - { rid: win-x64, os: ubuntu-latest }
          - { rid: win-arm64, os: ubuntu-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          # On a Mac the SDK signs the executable (ad hoc), without which Apple Silicon does not run it.
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # One executable per platform, with the runtime, the application's assemblies and the native libraries (Skia,
      # HarfBuzz; extracted on first run) inside it, and the symbols embedded. Next to it stay the files that are
      # opened from disk: plugins/, Help/ and the licence texts.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/UmlWizard.App -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded \
            -p:Version="$version" -o "publish/UmlWizard-$version-${{ matrix.rid }}"

      # The built-in code generators and importers must be next to the executable, or the app has none.
      - name: Check the plug-ins are included
        run: |
          count=$(ls publish/*/plugins/*.dll | wc -l)
          echo "$count plug-ins"
          test "$count" -gt 0

      - name: Check the executable is signed
        if: runner.os == 'macOS'
        run: codesign --verify --verbose publish/*/UmlWizard

      # zip keeps the executable bit of the Linux and macOS binaries.
      - name: Zip
        working-directory: publish
        run: |
          name=$(ls)
          zip -qr "../$name.zip" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: '*.zip'

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "UML Wizard ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
