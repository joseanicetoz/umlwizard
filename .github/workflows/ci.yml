# Builds the solution and runs the tests on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      # UmlWizard.slnx needs SDK 9.0.200 or later; 9.0.x picks the latest.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore UmlWizard.slnx
      - run: dotnet build UmlWizard.slnx -c Release --no-restore
      # --blame-crash names the test that was running if the test host crashes, and saves a dump in TestResults;
      # --blame-hang-timeout does the same for a test that hangs.
      - run: >
          dotnet test UmlWizard.slnx -c Release --no-build --logger trx --results-directory TestResults
          --blame-crash --blame-hang-timeout 5m

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
