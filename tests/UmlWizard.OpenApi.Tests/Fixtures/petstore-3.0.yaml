openapi: 3.0.3
info:
  title: Pet Store
  description: A sample store of pets, written for the UML Wizard tests.
  version: 1.2.0
  contact:
    name: Store team
    email: store@example.com
  license:
    name: MIT
servers:
  - url: https://api.example.com/v1
    description: Production
tags:
  - name: pets
    description: Everything about pets
  - name: store
security:
  - api_key: []
x-generated-by: hand
paths:
  /pets:
    get:
      tags:
        - pets
      summary: List all pets
      operationId: listPets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PetStatus'
      responses:
        '200':
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - pets
      summary: Create a pet
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: The created pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
  /pets/{petId}:
    get:
      tags:
        - pets
      summary: Info for a specific pet
      operationId: showPetById
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      tags:
        - pets
      operationId: deletePet
      deprecated: true
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /store/inventory:
    get:
      tags:
        - store
      operationId: getInventory
      security:
        - api_key: []
      responses:
        '200':
          description: Quantities by status
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
components:
  schemas:
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
    NewPet:
      type: object
      description: A pet as it is created.
      required:
        - name
      properties:
        name:
          type: string
          example: Rex
        tag:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PetStatus'
        birthDate:
          type: string
          format: date
        photoUrls:
          type: array
          items:
            type: string
        owner:
          $ref: '#/components/schemas/Owner'
        weight:
          type: number
          default: 1.5
    Owner:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    PetStatus:
      type: string
      enum:
        - available
        - pending
        - sold
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: header
